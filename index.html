<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ಯಕ್ಷ ಸಂಚಯ | Yaksha Sanchaya</title>

  <style>
    /* =========================================================
       YAKSHAGANA - EDITABLE PLAIN HTML/CSS
       All visual styling is kept here so it can be edited easily.
       ========================================================= */

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      color: #1a1a1a;
      font-family: Inter, "Noto Sans Kannada", "Noto Sans", Arial, sans-serif;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: #111;
    }

    .phone {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #FFF9F3;
      position: relative;
      overflow: hidden;
      padding-bottom: 84px;
    }

    /* ---------- HEADER ---------- */

    .hero {
      min-height: 180px;
      padding: 24px 18px;
      color: #fff;
      background: linear-gradient(135deg, #4a0a0a, #7a1a1a);
      position: relative;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.15;
      margin: 0;
    }

    .hero-subtitle {
      color: #F5E6C8;
      font-size: 12px;
      line-height: 1.65;
      margin-top: 8px;
    }

    .hero-center {
      text-align: center;
    }

    .admin-button {
      position: absolute;
      right: 12px;
      top: 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      color: #fff;
      padding: 7px 10px;
      font-size: 10px;
    }

    /* ---------- COMMON ---------- */

    .page {
      min-height: 100vh;
      background: #FFF9F3;
    }

    .section {
      padding: 14px;
    }

    .section-title {
      color: #8B0000;
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .card {
      background: #fff;
      border: 1px solid #E8D5D5;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .stack {
      display: grid;
      gap: 9px;
    }

    .muted {
      color: #777;
      font-size: 10px;
    }

    .small {
      font-size: 11px;
    }

    .empty {
      text-align: center;
      padding: 26px 10px;
      border: 2px dashed #E8D5D5;
      border-radius: 14px;
      color: #999;
      font-size: 11px;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #8B0000;
      color: #fff;
      padding: 11px 14px;
      font-weight: 700;
    }

    .gold {
      color: #FFC107;
    }

    /* ---------- ANNOUNCEMENTS ---------- */

    .notice {
      border-left: 4px solid #8B0000;
      line-height: 1.65;
      font-size: 12px;
    }

    .date-pill {
      display: inline-flex;
      border-radius: 999px;
      background: #8B0000;
      color: #fff;
      padding: 3px 8px;
      font-size: 9px;
      margin-bottom: 7px;
    }

    /* ---------- EVENTS ---------- */

    .event {
      border-left: 4px solid #FFC107;
    }

    .event-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .event-title {
      font-weight: 700;
      font-size: 12px;
    }

    /* ---------- GALLERY ---------- */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .gallery-item {
      border: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 14px;
      background: #E8D5D5;
      aspect-ratio: 1 / 1;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* ---------- VIDEO ---------- */

    .video {
      display: grid;
      gap: 8px;
    }

    .video video,
    .video iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
      background: #000;
    }

    .video a {
      color: #8B0000;
      font-weight: 700;
      font-size: 12px;
      text-decoration: none;
    }

    /* ---------- FORMS ---------- */

    .form {
      display: grid;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #E0E0E0;
      border-radius: 10px;
      background: #fff;
      padding: 10px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #8B0000;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .success {
      border: 1px solid #BBF7D0;
      background: #E8F5E9;
      color: #166534;
      border-radius: 10px;
      padding: 9px;
      font-size: 11px;
    }

    /* ---------- BOTTOM NAV ---------- */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 420px;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #fff;
      border-top: 1px solid #E0E0E0;
      box-shadow: 0 -4px 20px rgba(0,0,0,.08);
      padding: 6px;
    }

    .nav-button {
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #777;
      padding: 6px 3px;
      font-size: 10px;
      display: grid;
      gap: 2px;
      justify-items: center;
    }

    .nav-button.active {
      background: #8B0000;
      color: #fff;
    }

    .nav-icon {
      font-size: 17px;
      line-height: 1;
    }

    /* ---------- FULL SCREEN GALLERY ---------- */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.96);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      z-index: 101;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      color: #fff;
      font-size: 30px;
    }

    .lightbox-close {
      right: 12px;
      top: 12px;
    }

    .lightbox-prev {
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-count {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,.6);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 10px;
    }

    /* ---------- ADMIN ---------- */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0,0,0,.70);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      max-height: 94vh;
      overflow-y: auto;
      background: #FFF9F3;
      border-radius: 20px;
    }

    .admin-head {
      background: #8B0000;
      color: #fff;
      padding: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-close {
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      background: rgba(255,255,255,.1);
      border-radius: 999px;
      padding: 6px 9px;
    }

    .admin-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 9px;
      background: #fff;
      border-bottom: 1px solid #E0E0E0;
    }

    .admin-tab {
      flex: 0 0 auto;
      border: 1px solid #E8D5D5;
      border-radius: 999px;
      background: #fff;
      color: #8B0000;
      padding: 6px 10px;
      font-size: 10px;
    }

    .admin-tab.active {
      background: #8B0000;
      color: #fff;
    }

    .admin-content {
      padding: 12px;
    }

    .admin-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      background: #fff;
      border: 1px solid #E8D5D5;
      border-radius: 10px;
      padding: 9px;
      font-size: 10px;
    }

    .danger {
      border: 1px solid #FECACA;
      background: #FFF0F0;
      color: #DC2626;
      border-radius: 10px;
      padding: 9px;
      font-size: 10px;
      font-weight: 700;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .preview {
      overflow: hidden;
      border-radius: 10px;
      background: #eee;
    }

    .preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .progress {
      height: 7px;
      border-radius: 999px;
      background: #E8D5D5;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 0;
      background: #8B0000;
    }

    .toast {
      position: fixed;
      z-index: 200;
      bottom: 86px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: #222;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 10px;
    }

  <div class="app">
    <div class="phone">

    function load(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (error) {
        console.error("Storage read failed:", key, error);
        return fallback;
      }
    }

    function save(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        console.error("Storage write failed:", key, error);
      }
    }

    function saveAll() {
      save(KEYS.announcements, state.announcements);
      save(KEYS.events, state.events);
      save(KEYS.gallery, state.gallery);
      save(KEYS.videos, state.videos);
      save(KEYS.admissions, state.admissions);
      save(KEYS.donors, state.donors);
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

      } else if (state.page === "class") {

    function openLightbox(index) {

      document.getElementById("lightbox").style.display = "flex";
      document.body.style.overflow = "hidden";
      updateLightbox();
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
      document.body.style.overflow = "";
    }

    function updateLightbox() {
      const item = state.gallery[lightboxIndex];
      if (!item) return;

      document.getElementById("lightboxImage").src = item.url;
      document.getElementById("lightboxCount").textContent =
        `${lightboxIndex + 1} / ${state.gallery.length}`;
    }

    document.getElementById("lightboxClose").onclick = closeLightbox;

    document.getElementById("lightboxPrev").onclick = function(event) {
      event.stopPropagation();
      lightboxIndex =
        (lightboxIndex - 1 + state.gallery.length) % state.gallery.length;
      updateLightbox();
    };

    document.getElementById("lightboxNext").onclick = function(event) {
      event.stopPropagation();
      lightboxIndex =
        (lightboxIndex + 1) % state.gallery.length;
      updateLightbox();
    };

    document.getElementById("lightbox").onclick = function(event) {
      if (event.target === this) closeLightbox();
    };

    document.addEventListener("keydown", function(event) {
      if (document.getElementById("lightbox").style.display === "flex") {
        if (event.key === "Escape") closeLightbox();

        if (event.key === "ArrowLeft") {
          lightboxIndex =
            (lightboxIndex - 1 + state.gallery.length) % state.gallery.length;
          updateLightbox();
        }

        if (event.key === "ArrowRight") {

    });

            <input id="eventDate" type="date">
            <input id="eventPlace" placeholder="ಸ್ಥಳ">
            <input id="eventPrasanga" placeholder="ಪ್ರಸಂಗ">

            <button id="addEvent" class="primary">ಸೇರಿಸಿ</button>
          </div>

          ${state.events.map(item => `
            <div class="admin-row">
              <span>${escapeHTML(item.prasanga)} — ${escapeHTML(item.place)}</span>
              <button class="danger" data-delete-event="${item.id}">ಅಳಿಸಿ</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    function adminGallery() {
      return `
        <div class="stack">
          <div class="card form">
            <strong>ಚಿತ್ರ ಅಪ್ಲೋಡ್ — Cloudinary</strong>

            <input id="galleryFiles" type="file" accept="image/*" multiple>

            <div id="uploadStatus" class="small"></div>
            <div class="progress"><div id="uploadProgress"></div></div>
          </div>

          <div class="preview-grid">
            ${state.gallery.map(item => `
              <div class="preview">
                <img src="${escapeHTML(item.url)}" alt="">
                <button
                  class="danger"
                  style="width:100%;border-radius:0;"
                  data-delete-gallery="${item.id}">
                  ಅಳಿಸಿ
                </button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function adminVideos() {
      return `
        <div class="stack">
          <div class="card form">
            <strong>ವಿಡಿಯೋ ಅಪ್ಲೋಡ್ — Cloudinary</strong>

            <input id="videoFile" type="file" accept="video/*">

            <div id="videoUploadStatus" class="small"></div>
            <div class="progress"><div id="videoUploadProgress"></div></div>

            <div style="text-align:center;color:#999;font-size:10px;">ಅಥವಾ YouTube</div>

            <input id="youtubeTitle" placeholder="ವಿಡಿಯೋ ಶೀರ್ಷಿಕೆ">
            <input id="youtubeURL" placeholder="YouTube URL">
            <button id="addYoutube" class="primary">YouTube ಸೇರಿಸಿ</button>
          </div>

          ${state.videos.map(item => `
            <div class="admin-row">
              <span>${escapeHTML(item.title || "ವಿಡಿಯೋ")}</span>
              <button class="danger" data-delete-video="${item.id}">ಅಳಿಸಿ</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    function adminAdmissions() {
      return `
        <div class="stack">
          <div class="card">
            <strong>ಅರ್ಜಿಗಳು (${state.admissions.length})</strong>
          </div>

          ${state.admissions.map(item => `
            <div class="admin-row">
              <span>
                ${escapeHTML(item.name)}
                — ${escapeHTML(item.phone)}
                — ${escapeHTML(item.date)}
              </span>
              <button class="danger" data-delete-admission="${item.id}">ಅಳಿಸಿ</button>
            </div>
          `).join("") || `<div class="empty">ಯಾವುದೇ ಅರ್ಜಿ ಇಲ್ಲ</div>`}
        </div>
      `;
    }

    function adminDonors() {
      return `
        <div class="stack">
          <div class="card">
            <strong>ದಾನಿಗಳು (${state.donors.length})</strong>
          </div>

          ${state.donors.map(item => `
            <div class="admin-row">
              <span>
                ${escapeHTML(item.name)}
                — ${escapeHTML(item.phone)}
                — ${escapeHTML(item.date)}
              </span>
              <strong style="color:#8B0000;">₹${escapeHTML(item.amount)}</strong>
            </div>
          `).join("") || `<div class="empty">ಯಾವುದೇ ದಾನ ದಾಖಲೆಗಳಿಲ್ಲ</div>`}

          <div class="card" style="border-color:#FECACA;">
            <button id="deleteAllDonors" class="danger" style="width:100%;">
              🗑️ ದಾನಿಗಳ ಎಲ್ಲಾ ದಾಖಲೆ ಅಳಿಸಿ
            </button>
            <p class="muted" style="text-align:center;">
              ಈ ಬಟನ್ ದಾನಿಗಳ ದಾಖಲೆಗಳನ್ನು ಮಾತ್ರ ಅಳಿಸುತ್ತದೆ.
              ಚಿತ್ರಗಳು ಮತ್ತು ವಿಡಿಯೋಗಳನ್ನು ಅಳಿಸುವುದಿಲ್ಲ.
            </p>
          </div>
        </div>
      `;
    }

    function bindAdminEvents() {
      const addAnnouncement = document.getElementById("addAnnouncement");
      if (addAnnouncement) {
        addAnnouncement.onclick = function() {
          const text = document.getElementById("newAnnouncement").value.trim();
          if (!text) return;

          state.announcements.unshift({
            id: String(Date.now()),
            text,
            date: new Date().toLocaleDateString("en-IN")
          });

          save(KEYS.announcements, state.announcements);
          renderAdmin();
          render();
        };
      }

      document.querySelectorAll("[data-delete-announcement]").forEach(button => {
        button.onclick = function() {
          state.announcements =
            state.announcements.filter(x => x.id !== this.dataset.deleteAnnouncement);

          save(KEYS.announcements, state.announcements);
          renderAdmin();
          render();
        };
      });

      const addEvent = document.getElementById("addEvent");
      if (addEvent) {
        addEvent.onclick = function() {
          const date = document.getElementById("eventDate").value.trim();
          const place = document.getElementById("eventPlace").value.trim();
          const prasanga = document.getElementById("eventPrasanga").value.trim();

          if (!date || !place || !prasanga) {
            alert("ಎಲ್ಲಾ ವಿವರಗಳನ್ನು ನಮೂದಿಸಿ.");
            return;
          }

          state.events.unshift({
            id: String(Date.now()),
            date,
            place,
            prasanga
          });

          save(KEYS.events, state.events);
          renderAdmin();
          render();
        };
      }

      document.querySelectorAll("[data-delete-event]").forEach(button => {
        button.onclick = function() {
          state.events = state.events.filter(
            x => x.id !== this.dataset.deleteEvent
          );

          save(KEYS.events, state.events);
          renderAdmin();
          render();
        };
      });

      document.querySelectorAll("[data-delete-gallery]").forEach(button => {
        button.onclick = function() {
          state.gallery = state.gallery.filter(
            x => x.id !== this.dataset.deleteGallery
          );

          save(KEYS.gallery, state.gallery);
          renderAdmin();
          render();
        };
      });

      document.querySelectorAll("[data-delete-video]").forEach(button => {
        button.onclick = function() {
          state.videos = state.videos.filter(
            x => x.id !== this.dataset.deleteVideo
          );

          save(KEYS.videos, state.videos);
          renderAdmin();
          render();
        };
      });

      document.querySelectorAll("[data-delete-admission]").forEach(button => {
        button.onclick = function() {
          state.admissions = state.admissions.filter(
            x => x.id !== this.dataset.deleteAdmission
          );

          save(KEYS.admissions, state.admissions);
          renderAdmin();
        };
      });

      const deleteAllDonors = document.getElementById("deleteAllDonors");

      if (deleteAllDonors) {
        deleteAllDonors.onclick = function() {
          if (!confirm("ದಾನಿಗಳ ಎಲ್ಲಾ ದಾಖಲೆಗಳನ್ನು ಅಳಿಸಬೇಕೇ?")) return;

          /* IMPORTANT:
             Only donor data is removed here.
             Gallery and video storage are untouched. */
          state.donors = [];
          localStorage.removeItem(KEYS.donors);

          renderAdmin();
          render();
        };
      }

      const galleryFiles = document.getElementById("galleryFiles");

      if (galleryFiles) {
        galleryFiles.onchange = function() {
          uploadImages(this.files);
        };
      }

      const videoFile = document.getElementById("videoFile");

      if (videoFile) {
        videoFile.onchange = function() {
          uploadVideo(this.files[0]);
        };
      }

      const addYoutube = document.getElementById("addYoutube");

      if (addYoutube) {
        addYoutube.onclick = function() {
          const title = document.getElementById("youtubeTitle").value.trim();
          const url = document.getElementById("youtubeURL").value.trim();

          if (!url) return;

          state.videos.unshift({
            id: String(Date.now()),
            title: title || "ಯಕ್ಷಗಾನ ವಿಡಿಯೋ",
            url,
            type: "youtube"
          });

          save(KEYS.videos, state.videos);
          renderAdmin();
          render();
        };
      }
    }

    /* =========================================================
       CLOUDINARY UPLOAD
       ========================================================= */

    function uploadToCloudinary(file, onProgress) {
      return new Promise((resolve, reject) => {
        const resourceType = file.type.startsWith("video/")
          ? "video"
          : "image";

        const url =
          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;

        const form = new FormData();
        form.append("file", file);
        form.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const xhr = new XMLHttpRequest();

        xhr.open("POST", url);

        xhr.upload.onprogress = function(event) {
          if (event.lengthComputable && onProgress) {
            onProgress(
              Math.round((event.loaded / event.total) * 100)
            );
          }
        };

        xhr.onload = function() {
          let result = {};

          try {
            result = JSON.parse(xhr.responseText || "{}");
          } catch (error) {}

          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(result);
          } else {
            reject(
              new Error(
                result?.error?.message ||
                "Cloudinary upload failed."
              )
            );
          }
        };

        xhr.onerror = function() {
          reject(new Error("Cloudinary network error."));
        };

        xhr.send(form);
      });
    }

    async function uploadImages(files) {
      if (!files || !files.length) return;

      const status = document.getElementById("uploadStatus");
      const progress = document.getElementById("uploadProgress");

      for (const file of Array.from(files)) {
        if (!file.type.startsWith("image/")) continue;

        try {
          status.textContent = `${file.name} ಅಪ್ಲೋಡ್ ಆಗುತ್ತಿದೆ...`;

          const result = await uploadToCloudinary(file, value => {
            progress.style.width = value + "%";
          });

          state.gallery.unshift({
            id: String(Date.now()) + Math.random(),
            url: result.secure_url,
            publicId: result.public_id,
            type: "image"
          });

          save(KEYS.gallery, state.gallery);

          status.textContent = "ಚಿತ್ರ ಯಶಸ್ವಿಯಾಗಿ ಅಪ್ಲೋಡ್ ಆಗಿದೆ.";
          progress.style.width = "100%";
        } catch (error) {
          status.textContent = error.message;
          alert(error.message);
        }
      }

      renderAdmin();
      render();
    }

    async function uploadVideo(file) {
      if (!file) return;

      if (!file.type.startsWith("video/")) {
        alert("ದಯವಿಟ್ಟು ವಿಡಿಯೋ ಫೈಲ್ ಆಯ್ಕೆ ಮಾಡಿ.");
        return;
      }

      const status = document.getElementById("videoUploadStatus");
      const progress = document.getElementById("videoUploadProgress");

      try {
        status.textContent = "ವಿಡಿಯೋ ಅಪ್ಲೋಡ್ ಆಗುತ್ತಿದೆ...";

        const result = await uploadToCloudinary(file, value => {
          progress.style.width = value + "%";
        });

        state.videos.unshift({
          id: String(Date.now()),
          title: file.name,
          url: result.secure_url,
          publicId: result.public_id,
          type: "file"
        });

        save(KEYS.videos, state.videos);

        status.textContent = "ವಿಡಿಯೋ ಯಶಸ್ವಿಯಾಗಿ ಅಪ್ಲೋಡ್ ಆಗಿದೆ.";
        progress.style.width = "100%";

        renderAdmin();
        render();

      } catch (error) {
        status.textContent = error.message;
        alert(error.message);
      }
    }

    /* =========================================================
       START
       ========================================================= */

    render();
  </script>
</body>
