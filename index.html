<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ಯಕ್ಷ ಸಂಚಯ | Yaksha Sanchaya</title>

  <style>
    /* =========================================================
       YAKSHAGANA - EDITABLE PLAIN HTML/CSS
       All visual styling is kept here so it can be edited easily.
       ========================================================= */

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      color: #1a1a1a;
      font-family: Inter, "Noto Sans Kannada", "Noto Sans", Arial, sans-serif;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: #111;
    }

    .phone {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #FFF9F3;
      position: relative;
      overflow: hidden;
      padding-bottom: 84px;
    }

    /* ---------- HEADER ---------- */

    .hero {
      min-height: 180px;
      padding: 24px 18px;
      color: #fff;
      background: linear-gradient(135deg, #4a0a0a, #7a1a1a);
      position: relative;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.15;
      margin: 0;
    }

    .hero-subtitle {
      color: #F5E6C8;
      font-size: 12px;
      line-height: 1.65;
      margin-top: 8px;
    }

    .hero-center {
      text-align: center;
    }

    .admin-button {
      position: absolute;
      right: 12px;
      top: 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      color: #fff;
      padding: 7px 10px;
      font-size: 10px;
    }

    /* ---------- COMMON ---------- */

    .page {
      min-height: 100vh;
      background: #FFF9F3;
    }

    .section {
      padding: 14px;
    }

    .section-title {
      color: #8B0000;
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .card {
      background: #fff;
      border: 1px solid #E8D5D5;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .stack {
      display: grid;
      gap: 9px;
    }

    .muted {
      color: #777;
      font-size: 10px;
    }

    .small {
      font-size: 11px;
    }

    .empty {
      text-align: center;
      padding: 26px 10px;
      border: 2px dashed #E8D5D5;
      border-radius: 14px;
      color: #999;
      font-size: 11px;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #8B0000;
      color: #fff;
      padding: 11px 14px;
      font-weight: 700;
    }

    .gold {
      color: #FFC107;
    }

    /* ---------- ANNOUNCEMENTS ---------- */

    .notice {
      border-left: 4px solid #8B0000;
      line-height: 1.65;
      font-size: 12px;
    }

    .date-pill {
      display: inline-flex;
      border-radius: 999px;
      background: #8B0000;
      color: #fff;
      padding: 3px 8px;
      font-size: 9px;
      margin-bottom: 7px;
    }

    /* ---------- EVENTS ---------- */

    .event {
      border-left: 4px solid #FFC107;
    }

    .event-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .event-title {
      font-weight: 700;
      font-size: 12px;
    }

    /* ---------- GALLERY ---------- */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .gallery-item {
      border: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 14px;
      background: #E8D5D5;
      aspect-ratio: 1 / 1;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* ---------- VIDEO ---------- */

    .video {
      display: grid;
      gap: 8px;
    }

    .video video,
    .video iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
      background: #000;
    }

    .video a {
      color: #8B0000;
      font-weight: 700;
      font-size: 12px;
      text-decoration: none;
    }

    /* ---------- FORMS ---------- */

    .form {
      display: grid;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #E0E0E0;
      border-radius: 10px;
      background: #fff;
      padding: 10px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #8B0000;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .success {
      border: 1px solid #BBF7D0;
      background: #E8F5E9;
      color: #166534;
      border-radius: 10px;
      padding: 9px;
      font-size: 11px;
    }

    /* ---------- BOTTOM NAV ---------- */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 420px;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #fff;
      border-top: 1px solid #E0E0E0;
      box-shadow: 0 -4px 20px rgba(0,0,0,.08);
      padding: 6px;
    }

    .nav-button {
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #777;
      padding: 6px 3px;
      font-size: 10px;
      display: grid;
      gap: 2px;
      justify-items: center;
    }

    .nav-button.active {
      background: #8B0000;
      color: #fff;
    }

    .nav-icon {
      font-size: 17px;
      line-height: 1;
    }

    /* ---------- FULL SCREEN GALLERY ---------- */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.96);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      z-index: 101;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      color: #fff;
      font-size: 30px;
    }

    .lightbox-close {
      right: 12px;
      top: 12px;
    }

    .lightbox-prev {
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-count {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,.6);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 10px;
    }

    /* ---------- ADMIN ---------- */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0,0,0,.70);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      max-height: 94vh;
      overflow-y: auto;
      background: #FFF9F3;
      border-radius: 20px;
    }

    .admin-head {
      background: #8B0000;
      color: #fff;
      padding: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-close {
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      background: rgba(255,255,255,.1);
      border-radius: 999px;
      padding: 6px 9px;
    }

    .admin-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 9px;
      background: #fff;
      border-bottom: 1px solid #E0E0E0;
    }

    .admin-tab {
      flex: 0 0 auto;
      border: 1px solid #E8D5D5;
      border-radius: 999px;
      background: #fff;
      color: #8B0000;
      padding: 6px 10px;
      font-size: 10px;
    }

    .admin-tab.active {
      background: #8B0000;
      color: #fff;
    }

    .admin-content {
      padding: 12px;
    }

    .admin-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      background: #fff;
      border: 1px solid #E8D5D5;
      border-radius: 10px;
      padding: 9px;
      font-size: 10px;
    }

    .danger {
      border: 1px solid #FECACA;
      background: #FFF0F0;
      color: #DC2626;
      border-radius: 10px;
      padding: 9px;
      font-size: 10px;
      font-weight: 700;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .preview {
      overflow: hidden;
      border-radius: 10px;
      background: #eee;
    }

    .preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .progress {
      height: 7px;
      border-radius: 999px;
      background: #E8D5D5;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 0;
      background: #8B0000;
    }

    .toast {
      position: fixed;
      z-index: 200;
      bottom: 86px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: #222;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 10px;
    }

    let state = {
      page: "home",

      events: load(KEYS.events, [

      bookings: load(KEYS.bookings, [])
    };

    let lightboxIndex = 0;

    function load(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (error) {
        console.error("Storage read failed:", key, error);
        return fallback;
      }
    }

    function save(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        console.error("Storage write failed:", key, error);
      }
    }

    function saveAll() {
      save(KEYS.announcements, state.announcements);
      save(KEYS.events, state.events);
      save(KEYS.gallery, state.gallery);
      save(KEYS.videos, state.videos);
      save(KEYS.admissions, state.admissions);
      save(KEYS.donors, state.donors);
      save(KEYS.bookings, state.bookings);
    }

    async function saveMediaToRTDB(path, value) {
      if (!realtimeDbReady || !realtimeDb) return;
      await realtimeDb.ref(path).set(value || []);
    }

    async function clearLocalMediaKeys() {
      try {
        localStorage.removeItem(KEYS.gallery);
        localStorage.removeItem(KEYS.videos);
      } catch (error) {
        console.error("Media local storage cleanup failed:", error);
      }
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render() {
      const hero = document.getElementById("hero");
      if (hero) hero.innerHTML = renderHero();

      const app = document.getElementById("app");

      if (state.page === "home") {
        app.innerHTML = renderHome();
      } else if (state.page === "class") {
        app.innerHTML = renderClass();
      } else if (state.page === "events") {
        app.innerHTML = renderEvents();
      } else if (state.page === "donation") {
        app.innerHTML = renderDonation();
      }

      updateNavigation();
      bindPageEvents();
    }

    function updateNavigation() {
      document.querySelectorAll(".nav-button[data-page]").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.page === state.page
        );
      });
    }

    function bindPageEvents() {
      document.querySelectorAll(".nav-button[data-page]").forEach(button => {
        button.onclick = () => {
          state.page = button.dataset.page;
          render();
          window.scrollTo(0, 0);
        };
      });

      const admin = document.getElementById("openAdmin");
      if (admin) admin.onclick = openLogin;

      document.querySelectorAll("[data-gallery-index]").forEach(button => {
        button.onclick = () => {
          openLightbox(Number(button.dataset.galleryIndex));
        };
      });

      const admissionSubmit = document.getElementById("admissionSubmit");
      if (admissionSubmit) {
        admissionSubmit.onclick = submitAdmission;
      }

      const donationSubmit = document.getElementById("donationSubmit");
      if (donationSubmit) {
        donationSubmit.onclick = submitDonation;
      }

      const bookingSubmit = document.getElementById("bookingSubmit");
      if (bookingSubmit) {
        bookingSubmit.onclick = submitProgrammeBooking;
      }

      document.querySelectorAll(".booking-amount").forEach(button => {
        button.onclick = () => {
          const input = document.getElementById("bookingAmount");
          if (input) input.value = button.dataset.bookingAmount;
          document.querySelectorAll(".booking-amount").forEach(b => b.classList.remove("active"));
          button.classList.add("active");
        };
      });

      document.querySelectorAll(".amount-button").forEach(button => {
        button.onclick = () => {
          const amount = button.dataset.amount;
          const input = document.getElementById("donationAmount");
          const output = document.getElementById("donationButtonAmount");
          if (input) input.value = amount;
          if (output) output.textContent = amount;
          document.querySelectorAll(".amount-button").forEach(b => b.classList.remove("active"));
          button.classList.add("active");
        };
      });
    }

    function submitAdmission() {
      const name = document.getElementById("admissionName").value.trim();
      const phone = document.getElementById("admissionPhone").value.trim();

      if (!name || !phone) {
        alert("ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ.");
        return;
      }

      state.admissions.unshift({
        id: String(Date.now()),
        name,
        place: document.getElementById("admissionPlace").value.trim(),
        phone,
        age: document.getElementById("admissionAge").value.trim(),
        course: document.getElementById("admissionCourse").value,
        date: new Date().toLocaleDateString("en-IN")
      });

      save(KEYS.admissions, state.admissions);

      document.getElementById("admissionMessage").innerHTML =
        `<div class="success">ಅರ್ಜಿ ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಸಲಾಗಿದೆ.</div>`;

      document.getElementById("admissionName").value = "";
      document.getElementById("admissionPlace").value = "";
      document.getElementById("admissionPhone").value = "";
      document.getElementById("admissionAge").value = "";
    }

    async function submitProgrammeBooking() {
      const name = document.getElementById("bookingName").value.trim();
      const place = document.getElementById("bookingPlace").value.trim();
      const phone = document.getElementById("bookingPhone").value.trim();
      const venue = document.getElementById("bookingVenue").value.trim();
      const date = document.getElementById("bookingDate").value;
      const time = document.getElementById("bookingTime").value;
      const amount = document.getElementById("bookingAmount").value.trim();

      if (!name || !place || !phone || !venue || !date || !time || !amount) {
        alert("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಕಡ್ಡಾಯ ವಿವರಗಳನ್ನು ಮತ್ತು ಕಾರ್ಯಕ್ರಮದ ಮೊತ್ತವನ್ನು ನಮೂದಿಸಿ.");
        return;
      }

      const cleanPhone = phone.replace(/\D/g, "");
      if (!/^\d{10}$/.test(cleanPhone)) {
        alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ.");
        return;
      }

      const submitButton = document.getElementById("bookingSubmit");
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = "ಸಲ್ಲಿಸಲಾಗುತ್ತಿದೆ...";
      }

      const booking = {
        name,
        place,
        phone: cleanPhone,
        venue,
        date,
        time,
        amount: String(amount),
        prasanga: "ಯಕ್ಷಗಾನ ತಂಡದೊಂದಿಗೆ ಫೋನ್ ಮೂಲಕ ಚರ್ಚಿಸಿ ನಿಗದಿಪಡಿಸಲಾಗುವುದು",
        status: "ಹೊಸ ವಿನಂತಿ",
        submittedAt: new Date().toISOString(),
        source: "website"
      };

      try {
        if (!firestoreReady || !firestore) {
          throw new Error("Firebase ಇನ್ನೂ ಸಂಪರ್ಕಗೊಂಡಿಲ್ಲ. ದಯವಿಟ್ಟು Firebase config ಅನ್ನು HTML ನಲ್ಲಿ ಸೇರಿಸಿ.");
        }

        // Canonical cloud record. The document ID is generated by Firestore.
        const docRef = await firestore.collection("programmeBookings").add({
          ...booking,
          submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Keep a local cache as a fallback for the current browser.
        state.bookings.unshift({ id: docRef.id, ...booking });
        save(KEYS.bookings, state.bookings);

        document.getElementById("bookingMessage").innerHTML =
          `<div class="success">🎭 ಕಾರ್ಯಕ್ರಮ ಬುಕ್ಕಿಂಗ್ ವಿನಂತಿ ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಸಲಾಗಿದೆ. ನಮ್ಮ ತಂಡವು ಶೀಘ್ರದಲ್ಲೇ ಫೋನ್ ಮೂಲಕ ಸಂಪರ್ಕಿಸುತ್ತದೆ.</div>`;

        ["bookingName","bookingPlace","bookingPhone","bookingVenue","bookingAmount"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        document.getElementById("bookingDate").value = "";
        document.getElementById("bookingTime").value = "";
        document.querySelectorAll(".booking-amount").forEach(b => b.classList.remove("active"));
      } catch (error) {
        console.error("Programme booking submission failed:", error);
        document.getElementById("bookingMessage").innerHTML =
          `<div class="error">ಬುಕ್ಕಿಂಗ್ ಸಲ್ಲಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ದಯವಿಟ್ಟು ಇಂಟರ್ನೆಟ್ ಸಂಪರ್ಕ ಮತ್ತು Firebase ಸೆಟಪ್ ಪರಿಶೀಲಿಸಿ.</div>`;
      } finally {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = "ಕಾರ್ಯಕ್ರಮ ಬುಕ್ಕಿಂಗ್ ಸಲ್ಲಿಸಿ";
        }
      }
    }

    async function submitDonation() {
      const name = document.getElementById("donorName").value.trim();
      const amount = document.getElementById("donationAmount").value;
      const phone = document.getElementById("donorPhone").value.trim();

      if (!name || !amount) {
        alert("ಹೆಸರು ಮತ್ತು ದಾನ ಮೊತ್ತ ನಮೂದಿಸಿ.");
        return;
      }

      const donation = {
        name,
        phone,
        amount: String(amount),
        date: new Date().toLocaleDateString("en-IN"),
        source: "website",
        timestamp: new Date().toISOString(),
        submittedAt: new Date().toISOString()
      };

      try {
        if (!realtimeDbReady || !realtimeDb) {
          throw new Error("Firebase Realtime Database ಸಂಪರ್ಕಗೊಂಡಿಲ್ಲ");
        }

        await realtimeDb.ref("donations").push(donation);
        document.getElementById("donationMessage").innerHTML =
          `<div class="success">🙏 ಧನ್ಯವಾದಗಳು! ನಿಮ್ಮ ದೇಣಿಗೆ ದಾಖಲಾಗಿದೆ.</div>`;
      } catch (error) {
        console.error("Donation submission failed:", error);
        document.getElementById("donationMessage").innerHTML =
          `<div class="error">ದೇಣಿಗೆ Firebase ನಲ್ಲಿ ಉಳಿಸಲಾಗಲಿಲ್ಲ. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.</div>`;
        console.error("Donation was not saved to RTDB; no local donor record was created.");
      }

      document.getElementById("donorName").value = "";
      document.getElementById("donorPhone").value = "";
    }

          lightboxIndex =
            (lightboxIndex - 1 + state.gallery.length) % state.gallery.length;

          );

          save(KEYS.admissions, state.admissions);
          renderAdmin();
        };
      });

      document.querySelectorAll("[data-delete-booking]").forEach(button => {
        button.onclick = async function() {
          if (!confirm("ಈ ಕಾರ್ಯಕ್ರಮ ಬುಕ್ಕಿಂಗ್ ದಾಖಲೆಯನ್ನು ಅಳಿಸಬೇಕೇ?")) return;
          const id = this.dataset.deleteBooking;
          try {
            if (!firestoreReady || !firestore) throw new Error("Firebase ಸಂಪರ್ಕಗೊಂಡಿಲ್ಲ");
            await firestore.collection("programmeBookings").doc(id).delete();
          } catch (error) {
            console.error("Booking delete failed:", error);
            alert("ಬುಕ್ಕಿಂಗ್ ಅಳಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. Firebase ಸೆಟಪ್ ಪರಿಶೀಲಿಸಿ.");
          }
        };
      });

      const deleteAllBookings = document.getElementById("deleteAllBookings");
      if (deleteAllBookings) {
        deleteAllBookings.onclick = async function() {
          if (!confirm("ಎಲ್ಲಾ ಕಾರ್ಯಕ್ರಮ ಬುಕ್ಕಿಂಗ್ ದಾಖಲೆಗಳನ್ನು ಅಳಿಸಬೇಕೇ?")) return;
          try {
            if (!firestoreReady || !firestore) throw new Error("Firebase ಸಂಪರ್ಕಗೊಂಡಿಲ್ಲ");
            const snapshot = await firestore.collection("programmeBookings").get();
            const batch = firestore.batch();
            snapshot.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          } catch (error) {
            console.error("All booking delete failed:", error);
            alert("ಬುಕ್ಕಿಂಗ್ ದಾಖಲೆಗಳನ್ನು ಅಳಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. Firebase ಸೆಟಪ್ ಪರಿಶೀಲಿಸಿ.");

              await realtimeDb.ref("donations").remove();

            state.donors = [];
            save(KEYS.donors, state.donors);
            renderAdmin();
            render();
          } catch (error) {
            console.error("All donor delete failed:", error);
            alert("ದಾನ ದಾಖಲೆಗಳನ್ನು ಅಳಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. Firebase ಸೆಟಪ್ ಪರಿಶೀಲಿಸಿ.");
          }
        };
      }

      const galleryFiles = document.getElementById("galleryFiles");

      if (galleryFiles) {
        galleryFiles.onchange = function() {
          uploadImages(this.files);
        };
      }

      const videoFile = document.getElementById("videoFile");

      if (videoFile) {
        videoFile.onchange = function() {
          uploadVideo(this.files[0]);
        };
      }

      const addYoutube = document.getElementById("addYoutube");

      if (addYoutube) {
        addYoutube.onclick = function() {
          const title = document.getElementById("youtubeTitle").value.trim();
          const url = document.getElementById("youtubeURL").value.trim();

          if (!url) return;

          state.videos.unshift({
            id: String(Date.now()),
            title: title || "ಯಕ್ಷಗಾನ ವಿಡಿಯೋ",
            url,
            type: "youtube"
          });

          save(KEYS.videos, state.videos);
          renderAdmin();
          render();
        };
      }
    }

    /* =========================================================
       CLOUDINARY UPLOAD
       ========================================================= */

    function uploadToCloudinary(file, onProgress) {
      return new Promise((resolve, reject) => {
        const resourceType = file.type.startsWith("video/")
          ? "video"
          : "image";

        const url =
          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;

        const form = new FormData();
        form.append("file", file);
        form.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const xhr = new XMLHttpRequest();

        xhr.open("POST", url);

        xhr.upload.onprogress = function(event) {
          if (event.lengthComputable && onProgress) {
            onProgress(
              Math.round((event.loaded / event.total) * 100)
            );
          }
        };

        xhr.onload = function() {
          let result = {};

          try {
            result = JSON.parse(xhr.responseText || "{}");
          } catch (error) {}

          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(result);
          } else {
            reject(
              new Error(
                result?.error?.message ||
                "Cloudinary upload failed."
              )
            );
          }
        };

        xhr.onerror = function() {
          reject(new Error("Cloudinary network error."));
        };

        xhr.send(form);
      });
    }

    async function uploadImages(files) {
      if (!files || !files.length) return;

      const status = document.getElementById("uploadStatus");
      const progress = document.getElementById("uploadProgress");

      for (const file of Array.from(files)) {
        if (!file.type.startsWith("image/")) continue;

        try {
          status.textContent = `${file.name} ಅಪ್ಲೋಡ್ ಆಗುತ್ತಿದೆ...`;

          const result = await uploadToCloudinary(file, value => {
            progress.style.width = value + "%";
          });

          state.gallery.unshift({
            id: String(Date.now()) + Math.random(),
            url: result.secure_url,
            publicId: result.public_id,
            type: "image"
          });

          save(KEYS.gallery, state.gallery);
          await saveMediaToRTDB("siteContent/gallery", state.gallery);

          status.textContent = "ಚಿತ್ರ ಯಶಸ್ವಿಯಾಗಿ ಅಪ್ಲೋಡ್ ಆಗಿದೆ.";
          progress.style.width = "100%";
        } catch (error) {
          status.textContent = error.message;
          alert(error.message);
        }
      }

      renderAdmin();
      render();
    }

    async function uploadVideo(file) {
      if (!file) return;

      if (!file.type.startsWith("video/")) {
        alert("ದಯವಿಟ್ಟು ವಿಡಿಯೋ ಫೈಲ್ ಆಯ್ಕೆ ಮಾಡಿ.");
        return;
      }

      const status = document.getElementById("videoUploadStatus");
      const progress = document.getElementById("videoUploadProgress");

      try {
        status.textContent = "ವಿಡಿಯೋ ಅಪ್ಲೋಡ್ ಆಗುತ್ತಿದೆ...";

        const result = await uploadToCloudinary(file, value => {
          progress.style.width = value + "%";
        });

        state.videos.unshift({
          id: String(Date.now()),
          title: file.name,
          url: result.secure_url,
          publicId: result.public_id,
          type: "file"
        });

        save(KEYS.videos, state.videos);
        await saveMediaToRTDB("siteContent/videos", state.videos);

        status.textContent = "ವಿಡಿಯೋ ಯಶಸ್ವಿಯಾಗಿ ಅಪ್ಲೋಡ್ ಆಗಿದೆ.";
        progress.style.width = "100%";

        renderAdmin();
        render();

      } catch (error) {
        status.textContent = error.message;
        alert(error.message);
      }
    }

    /* =========================================================
       FIRESTORE PROGRAMME BOOKING SYNC
       Visitor submissions are stored in Firestore and the admin
       section receives live updates through onSnapshot().
       ========================================================= */
    function startProgrammeBookingSync() {
      if (!firestoreReady || !firestore) return;

      firestore.collection("programmeBookings")
        .orderBy("submittedAt", "desc")
        .onSnapshot(snapshot => {
          state.bookings = snapshot.docs.map(doc => {
            const data = doc.data() || {};
            const submittedAt = data.submittedAt && data.submittedAt.toDate
              ? data.submittedAt.toDate().toLocaleString("en-IN")
              : (data.submittedAt || "");
            return { id: doc.id, ...data, submittedAt };
          });

          save(KEYS.bookings, state.bookings);
          render();

          if (document.getElementById("adminModal")?.style.display !== "none") {
            renderAdmin();
          }
        }, error => {
          console.error("Programme booking Firestore listener failed:", error);
        });
    }

    /* =========================================================
       START
       ========================================================= */

    /* =========================================================
       FIREBASE REALTIME DATABASE LIVE DONATION SYNC
       MacroDroid -> Activepieces -> RTDB -> this listener.

       Activepieces writes to:
       https://website-builder-236cf-default-rtdb.firebaseio.com/donations.json
       ========================================================= */
    function startDonationSync() {
      if (!realtimeDbReady || !realtimeDb) return;

      realtimeDb.ref("donations").on("value", snapshot => {
        const cloudDonors = [];

        snapshot.forEach(child => {
          const data = child.val() || {};
          let submittedDate = null;

          if (data.submittedAt) {
            const parsed = new Date(data.submittedAt);
            if (!Number.isNaN(parsed.getTime())) submittedDate = parsed;
          }

          if (!submittedDate && data.timestamp) {
            const parsed = new Date(data.timestamp);
            if (!Number.isNaN(parsed.getTime())) submittedDate = parsed;
          }

          if (!submittedDate && data.date) {
            const parsed = new Date(data.date);
            if (!Number.isNaN(parsed.getTime())) submittedDate = parsed;
          }

          cloudDonors.push({
            id: child.key,
            cloud: true,
            name: data.name || data.donorName || "Donor",
            phone: data.phone || "",
            amount: String(data.amount ?? ""),
            date: data.date || (submittedDate
              ? submittedDate.toLocaleDateString("en-IN")
              : new Date().toLocaleDateString("en-IN")),
            source: data.source || "MobiKwik",
            submittedAt: submittedDate ? submittedDate.toISOString() : "",
            notification: data.notification || data.notification_text || ""
          });
        });

        cloudDonors.sort((a, b) => {
          const timeA = a.submittedAt ? new Date(a.submittedAt).getTime() : 0;
          const timeB = b.submittedAt ? new Date(b.submittedAt).getTime() : 0;
          return timeB - timeA;
        });

        state.donors = cloudDonors;
        save(KEYS.donors, state.donors);
        render();

        if (document.getElementById("adminModal")?.style.display !== "none") {
          renderAdmin();
        }
      }, error => {
        console.error("Donation Realtime Database listener failed:", error);
      });
    }

    function startMediaSync() {
      if (!realtimeDbReady || !realtimeDb) return;

      realtimeDb.ref("siteContent/gallery").on("value", snapshot => {
        const remote = snapshot.val();
        if (remote == null) {
          // The cloud has no gallery records; keep it empty instead of reviving old local data.
          state.gallery = [];
          save(KEYS.gallery, state.gallery);
          saveMediaToRTDB("siteContent/gallery", []).catch(console.error);
        } else {
          state.gallery = Array.isArray(remote) ? remote : Object.values(remote || {});
          save(KEYS.gallery, state.gallery);
        }
        render();
        if (document.getElementById("adminModal")?.style.display !== "none") renderAdmin();
      }, error => console.error("Gallery RTDB listener failed:", error));

      realtimeDb.ref("siteContent/videos").on("value", snapshot => {
        const remote = snapshot.val();
        if (remote == null) {
          state.videos = [];
          save(KEYS.videos, state.videos);
          saveMediaToRTDB("siteContent/videos", []).catch(console.error);
        } else {
          state.videos = Array.isArray(remote) ? remote : Object.values(remote || {});
          save(KEYS.videos, state.videos);
        }
        render();
        if (document.getElementById("adminModal")?.style.display !== "none") renderAdmin();
      }, error => console.error("Videos RTDB listener failed:", error));
    }

    // Start live media and donation listeners.
    startMediaSync();
    startDonationSync();

    // Donation helper: RTDB is the only source of truth.
    window.addDonorFromSMS = async function(name, amount){
      if(!name || !amount || !realtimeDbReady || !realtimeDb) return;
      await realtimeDb.ref("donations").push({
        name: String(name).trim(),
        amount: parseFloat(String(amount).replace(/[^0-9.]/g, '')),
        date: new Date().toLocaleDateString('en-IN'),
        source: "UPI Auto",
        timestamp: new Date().toISOString(),
        submittedAt: new Date().toISOString()
      });
    };

    render();
  </script>
